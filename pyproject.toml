[project]
name = "support-desk-crew"
version = "0.1.0"
description = "A multi-agent customer support desk, built phase by phase for learning."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Phase-gated extras, so Phase 0 installs in seconds. Enable each one when its phase starts.
agents = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-openai>=0.2",
]
rag = ["chromadb>=0.5"]
ui = ["streamlit>=1.38"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
support-desk-verify = "support_desk.data.verify:main"
support-desk-score-triage = "support_desk.scoring:main"
support-desk-scorecard = "support_desk.evals:main"

[tool.uv]
# `uv sync` installs the dev group without being asked.
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["slow: spawns real subprocesses; durability checks"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # assert is the point of a test suite

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
